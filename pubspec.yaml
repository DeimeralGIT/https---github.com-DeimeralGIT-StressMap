name: stressmap
description: "A polished Flutter MVP for visualizing population stress indicators on an interactive map."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  easy_localization: ^3.0.8
  flutter_map: ^8.2.2
  geolocator: ^14.0.2
  google_mobile_ads: ^6.0.0
  http: ^1.5.0
  latlong2: ^0.9.1
  provider: ^6.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/translations/
    - web/icons/Icon-192.png
